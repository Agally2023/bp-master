# Builds the Windows installer (.exe) and the Android app (.apk) on GitHub's servers.
# Run it: GitHub > Actions > "build-apps" > Run workflow. Download the files from the run's "Artifacts" (and from the Releases page, which the app's Updates menu reads).
name: build-apps
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: BP-Master-Windows, path: desktop/dist/*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the Ubuntu runner already ships the Android SDK, so no separate SDK setup step is needed
      - name: Create the Android project
        working-directory: mobile
        run: |
          sed -i 's/APPVER/1.0.${{ github.run_number }}/' capacitor.config.json
          npm install
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
          npx cap sync android
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk BP-Master.apk
      - uses: actions/upload-artifact@v4
        with: { name: BP-Master-Android, path: BP-Master.apk }
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: BP Master apps, build ${{ github.run_number }}
          make_latest: true
          files: |
            out/BP-Master-Windows/*.exe
            out/BP-Master-Android/BP-Master.apk
