# Builds the Windows installer (.exe) and the Android app (.apk) on GitHub's servers.
# Run it: GitHub > Actions > "build-apps" > Run workflow. Download the files from the run's "Artifacts" (or from Releases when a tag app-v* is pushed).
name: build-apps
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: BP-Master-Windows, path: desktop/dist/*.exe }
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the Ubuntu runner already ships the Android SDK, so no separate SDK setup step is needed
      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
          npx cap sync android
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk BP-Master.apk
      - uses: actions/upload-artifact@v4
        with: { name: BP-Master-Android, path: BP-Master.apk }
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with: { files: BP-Master.apk }
